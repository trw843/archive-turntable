<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive Turntable</title>
<style>
:root{--bg:#d3d3d3;--card:#e4e4e4;--ink:#1d1e20;--mute:#666;--red:#e0202a;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:#c9c9c9;color:var(--ink);font-family:var(--mono);letter-spacing:.04em}.app{max-width:1100px;margin:auto;padding:16px}.shell{background:var(--bg);border-radius:32px;padding:16px;display:grid;grid-template-columns:minmax(300px,430px) minmax(0,1fr);gap:12px;align-items:start}.col{display:flex;flex-direction:column;gap:12px;min-width:0}.card{background:var(--card);border-radius:26px;padding:20px}.top{display:flex;align-items:center;gap:18px;border-radius:60px}.dot{flex:none;width:62px;height:62px;border-radius:50%;background:#aaa;display:grid;place-items:center}.dot:after{content:"";width:14px;height:14px;background:white;border-radius:50%}.playing .dot{background:var(--red)}.playing .dot:after{animation:pulse 1.6s infinite}@keyframes pulse{50%{transform:scale(.5);opacity:.5}}h1{font-size:1rem;margin:0;text-transform:uppercase}.top p{font-size:.8rem;margin:5px 0 0}.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.14em}.lbl b{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.platter{position:relative;width:100%;max-width:300px;aspect-ratio:1;margin:18px auto 4px;border:1.5px solid var(--ink);border-radius:50%}.disc{position:absolute;inset:7%;border-radius:50%;background:repeating-radial-gradient(circle,#232427 0 2px,#2c2d30 3px 4px);animation:spin 1.8s linear infinite;animation-play-state:paused}.playing .disc{animation-play-state:running}@keyframes spin{to{transform:rotate(360deg)}}.label{position:absolute;inset:34%;border-radius:50%;background:#bbb center/cover;border:1px solid #111}.label:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:9%;aspect-ratio:1;background:var(--card);border-radius:50%}.arm{position:absolute;right:0;top:0;transform-origin:0 0;transform:rotate(14deg);transition:transform 1.2s}.arm i{position:absolute;width:2px;height:200px;background:var(--ink)}.arm:before{content:"";position:absolute;left:-7px;top:-7px;width:16px;height:16px;border-radius:50%;background:var(--ink)}.arm:after{content:"";position:absolute;left:-4px;top:195px;width:10px;height:16px;background:var(--ink)}.playing .arm{transform:rotate(30deg)}.now{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-top:14px}.now>div:first-child{min-width:0}.now b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now small{color:var(--mute)}.big,.val{font-size:2rem}input[type=range]{width:100%;accent-color:var(--ink)}.time{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mute)}.ctrl{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}button{font:inherit;text-transform:uppercase;font-size:.78rem;letter-spacing:.08em;border:0;border-radius:40px;padding:12px 18px;background:#f2f2f2;color:var(--ink);cursor:pointer}button:hover{background:white}button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}.dark,button.on{background:var(--ink);color:#fff}.dark:hover,button.on:hover{background:#444}.tracks{display:flex;gap:10px;overflow-x:auto;margin-top:14px}.tracks:empty:before{content:"No record loaded";color:var(--mute);font-size:.8rem}.track{flex:none;width:95px;text-align:center;padding:8px 2px;font-size:.7rem;background:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track:before{content:attr(data-n);display:block;font-size:1.4rem}.track.cur{text-decoration:underline;font-weight:bold}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:220px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}.meter{width:100%;max-width:200px;margin:12px auto}.circ{width:120px;height:120px;border:1px solid var(--ink);border-radius:50%;margin:12px auto;display:grid;place-items:center}.circ div{width:96px;height:96px;background:var(--ink);border-radius:50%}.bar{display:flex;gap:10px;margin-top:12px}.bar input{flex:1;min-width:0;border:0;border-radius:40px;background:#f2f2f2;padding:12px 18px;font:inherit}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chips button{padding:8px 12px;border:1px solid #aaa;background:transparent;font-size:.7rem}.chips button.on{background:var(--ink);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;margin-top:18px}.rec{border:0;background:transparent;text-align:left;padding:0;min-width:0}.sleeve{display:block;aspect-ratio:1;background:#bbb center/cover;border:1px solid var(--ink);border-radius:18px}.rec:hover .sleeve{transform:scale(.97)}.rec strong{display:block;font-size:.72rem;margin:8px 4px 0;line-height:1.3}.rec small{display:block;margin:3px 4px;color:var(--mute)}.msg{grid-column:1/-1;text-align:center;padding:24px;color:var(--mute);font-size:.8rem;line-height:1.5}.hidden{display:none}@media(max-width:860px){.shell{grid-template-columns:1fr}}@media(max-width:390px){.tiles{grid-template-columns:1fr 1fr}.card{padding:14px}.arm i{height:170px}.arm:after{top:165px}}
</style>
</head>
<body><main class="app"><div class="shell"><section class="col" id="deck">
<div class="card top"><div class="dot"></div><div><h1 id="status">Standby</h1><p>Archive Turntable</p></div></div>
<div class="card"><div class="lbl">Now playing<b id="subtitle">Pick a record</b></div><div class="platter"><div class="disc"></div><div class="label" id="label"></div><div class="arm"><i></i></div></div><div class="now"><div><b id="title">Drop the needle</b><small>33⅓ RPM</small></div><div class="big" id="clock">0:00</div></div><input aria-label="Seek" type="range" id="seek" min="0" max="1000" value="0"><div class="time"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="ctrl"><button id="prev" aria-label="Previous track">◀◀</button><button class="dark" id="play">▶ Play</button><button id="next" aria-label="Next track">▶▶</button></div></div>
<div class="card"><div class="lbl">Tracklist</div><div class="tracks" id="tracks"></div></div><div class="tiles"><div class="card tile"><div class="lbl">Progress<b>Track</b></div><svg class="meter" viewBox="0 0 200 110" aria-hidden="true"><path d="M12 100 A88 88 0 0 1 188 100" fill="none" stroke="currentColor"/><line x1="0" y1="100" x2="200" y2="100" stroke="currentColor"/><line id="needle" x1="100" y1="100" x2="100" y2="28" stroke="currentColor" stroke-width="2" transform="rotate(-90 100 100)"/></svg><div class="val" id="progress">0%</div></div><div class="card tile"><div class="lbl">Volume</div><div class="circ"><div id="voldot"></div></div><div><div class="val" id="volpct">80%</div><input aria-label="Volume" type="range" id="vol" min="0" max="1" step=".01" value=".8"></div></div><div class="card tile"><div class="lbl">Crackle<b>Surface noise</b></div><button id="crackle" class="on" aria-pressed="true">ON</button><input aria-label="Crackle level" type="range" id="crackle-level" min="0" max=".3" step=".005" value=".08"><div class="lbl">Level</div></div><div class="card tile"><div class="lbl">Warm tone<b>Analog EQ</b></div><button id="warm" class="on" aria-pressed="true">ON</button><div class="lbl">Low-pass</div></div></div><audio id="audio" crossorigin="anonymous" preload="none"></audio></section>
<section class="col"><div class="card"><div class="lbl">Genre radio<b id="genre-name">All favorites</b></div><div class="chips" id="genres"></div><div class="ctrl" style="justify-content:flex-start"><button class="dark" id="shuffle">⇆ Shuffle</button><button class="on" id="auto" aria-pressed="true">Auto-play: ON</button></div></div><div class="card"><div class="lbl">My favorites crate<b id="count"></b></div><form class="bar" id="search"><input type="search" id="query" aria-label="Search my favorites" placeholder="SEARCH MY FAVORITES"><button class="dark">Go</button></form><div class="grid" id="grid"></div><div class="ctrl"><button id="more" class="hidden">Load more</button></div></div></section></div></main>
<script>
'use strict';
const FAV_COLLECTION='fav-trent_williamson517';
const $=id=>document.getElementById(id),audio=$('audio'),deck=$('deck');
const GENRES={'All':'','Jazz':'(jazz OR bebop OR "big band" OR swing)','Classic Rock':'("classic rock" OR "hard rock" OR "rock and roll" OR psychedelic)','Indie':'(indie OR "alternative rock" OR "lo-fi" OR "college radio" OR "post-punk")','Country Western':'(country OR western OR bluegrass OR "honky tonk" OR cowboy)','Blues':'(blues OR delta)','Soul / R&B':'(soul OR motown OR "r&b" OR funk)','Folk':'(folk OR "singer-songwriter")','Classical':'(classical OR symphony OR orchestra OR opera)','Soundtrack':'(soundtrack OR "original cast" OR musical)','Easy Listening':'(lounge OR "easy listening" OR exotica OR "space age pop")','Holiday':'(christmas OR holiday)'};
let genre='All',page=1,tracks=[],index=0,item=null,lastId=null,autoPlay=true,searchToken=0,loadToken=0,ctx,filter,crackleGain,crackleOn=true,warmOn=true;
function one(value){return Array.isArray(value)?value[0]:value}
function queryFor(text=''){const parts=['collection:'+FAV_COLLECTION,'mediatype:audio'];if(text)parts.push('('+text+')');if(GENRES[genre])parts.push(GENRES[genre]);return parts.join(' AND ')}
function apiUrl(text,rows,n){const u=new URL('https://archive.org/advancedsearch.php');u.searchParams.set('q',queryFor(text));for(const field of ['identifier','title','creator','year'])u.searchParams.append('fl[]',field);u.searchParams.set('output','json');u.searchParams.set('rows',rows);u.searchParams.set('page',n);return u}
async function json(url){const response=await fetch(url);if(!response.ok)throw Error('HTTP '+response.status);return response.json()}
function message(text){const div=document.createElement('div');div.className='msg';div.textContent=text;return div}
function renderRecord(d){const button=document.createElement('button');button.type='button';button.className='rec';const sleeve=document.createElement('span');sleeve.className='sleeve';sleeve.style.backgroundImage='url("https://archive.org/services/img/'+encodeURIComponent(d.identifier)+'")';const title=document.createElement('strong');title.textContent=one(d.title)||d.identifier;const artist=document.createElement('small');artist.textContent=(one(d.creator)||'Unknown artist')+(d.year?' / '+one(d.year):'');button.append(sleeve,title,artist);button.onclick=()=>load(d);return button}
async function search(reset=true){const token=++searchToken,grid=$('grid'),selected=genre,text=$('query').value.trim();if(reset){page=1;grid.replaceChildren()}const marker=message('Loading crate…');grid.append(marker);try{const result=await json(apiUrl(text,48,page));if(token!==searchToken||selected!==genre)return;marker.remove();const docs=result.response?.docs||[];if(reset)$('count').textContent=(result.response?.numFound||0)+' records';if(!docs.length&&reset)grid.append(message('No favorites found. Try another search or genre, or check the collection name and public visibility.'));grid.append(...docs.map(renderRecord));$('more').classList.toggle('hidden',docs.length<48)}catch(error){if(token===searchToken)marker.textContent='Could not reach the Archive: '+error.message}}
function setGenre(name){genre=name;$('genre-name').textContent=name==='All'?'All favorites':name;for(const b of $('genres').children){b.classList.toggle('on',b.dataset.genre===name);b.setAttribute('aria-pressed',String(b.dataset.genre===name))}$('query').value='';search();randomRecord()}
for(const name of Object.keys(GENRES)){const b=document.createElement('button');b.textContent=name;b.dataset.genre=name;b.classList.toggle('on',name==='All');b.setAttribute('aria-pressed',String(name==='All'));b.onclick=()=>setGenre(name);$('genres').append(b)}
$('search').onsubmit=e=>{e.preventDefault();search()};$('more').onclick=()=>{page++;search(false)};$('shuffle').onclick=()=>randomRecord();$('auto').onclick=()=>{autoPlay=!autoPlay;$('auto').textContent='Auto-play: '+(autoPlay?'ON':'OFF');$('auto').classList.toggle('on',autoPlay);$('auto').setAttribute('aria-pressed',String(autoPlay))};
async function randomRecord(){const selected=genre;const token=++loadToken;$('title').textContent='Finding a record…';$('subtitle').textContent=selected;try{const result=await json(apiUrl('',200,1));if(token!==loadToken||selected!==genre)return;let docs=result.response?.docs||[];if(docs.length>1)docs=docs.filter(d=>d.identifier!==lastId);if(!docs.length){$('title').textContent='No favorites in this genre';return}for(let i=0;i<Math.min(5,docs.length);i++){const k=Math.floor(Math.random()*docs.length);const [d]=docs.splice(k,1);if(await load(d,token))return;if(token!==loadToken)return}$('title').textContent='No playable MP3 found'}catch(error){if(token===loadToken){$('title').textContent='Could not reach the Archive';$('subtitle').textContent=error.message}}}
async function load(d,existingToken){const token=existingToken??++loadToken;$('title').textContent='Loading…';$('subtitle').textContent=one(d.title)||d.identifier;try{const meta=await json('https://archive.org/metadata/'+encodeURIComponent(d.identifier));if(token!==loadToken)return false;let files=(meta.files||[]).filter(f=>f.name&&(/\.mp3$/i.test(f.name)||/mp3/i.test(f.format||'')));const vbr=files.filter(f=>/vbr/i.test(f.format||''));if(vbr.length)files=vbr;const seen=new Set();files=files.filter(f=>{if(seen.has(f.name))return false;seen.add(f.name);return true}).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!files.length){$('title').textContent='No playable tracks';$('subtitle').textContent='No MP3 derivative';return false}tracks=files;item={id:d.identifier,title:one(d.title)||d.identifier,artist:one(d.creator)||'Unknown artist'};lastId=d.identifier;$('label').style.backgroundImage='url("https://archive.org/services/img/'+encodeURIComponent(d.identifier)+'")';renderTracks();playTrack(0);return true}catch(error){if(token===loadToken){$('title').textContent='Error loading record';$('subtitle').textContent=error.message}return false}}
function renderTracks(){const nodes=tracks.map((t,i)=>{const b=document.createElement('button');b.className='track';b.dataset.n=String(i+1).padStart(2,'0');b.textContent=t.title||t.name;b.title=t.title||t.name;b.onclick=()=>playTrack(i);return b});$('tracks').replaceChildren(...nodes)}
function playTrack(i){if(!tracks.length||!item)return;index=(i+tracks.length)%tracks.length;const t=tracks[index];audio.src='https://archive.org/download/'+encodeURIComponent(item.id)+'/'+t.name.split('/').map(encodeURIComponent).join('/');$('title').textContent=t.title||t.name;$('subtitle').textContent=item.artist+' - '+item.title;[...$('tracks').children].forEach((b,n)=>b.classList.toggle('cur',n===index));playAudio()}
async function playAudio(){try{initAudio();await ctx.resume();await audio.play()}catch(error){$('status').textContent='Playback unavailable';$('subtitle').textContent='Press Play or try another record: '+error.message}}
$('play').onclick=()=>{if(!tracks.length){randomRecord();return}if(audio.paused)playAudio();else audio.pause()};$('next').onclick=()=>tracks.length&&playTrack(index+1);$('prev').onclick=()=>tracks.length&&playTrack(index-1);
audio.onplay=()=>{deck.classList.add('playing');$('status').textContent='Playing';$('play').textContent='❚❚ Pause';updateCrackle()};audio.onpause=()=>{deck.classList.remove('playing');$('status').textContent='Paused';$('play').textContent='▶ Play';updateCrackle()};audio.onended=()=>{if(index<tracks.length-1)playTrack(index+1);else if(autoPlay)randomRecord()};audio.onerror=()=>{if(audio.src){$('status').textContent='Playback error';$('subtitle').textContent='This file may be unavailable or block cross-origin audio. Try another record.'}};
const fmt=s=>Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';audio.ontimeupdate=()=>{const p=Number.isFinite(audio.duration)&&audio.duration>0?Math.min(1,audio.currentTime/audio.duration):0;$('elapsed').textContent=$('clock').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration);$('seek').value=Math.round(p*1000);$('needle').setAttribute('transform','rotate('+(-90+p*180)+' 100 100)');$('progress').textContent=Math.round(p*100)+'%'};$('seek').oninput=e=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=e.target.value/1000*audio.duration};
function volume(){const v=+$('vol').value;audio.volume=v;$('voldot').style.transform='scale('+(0.1+v*.9)+')';$('volpct').textContent=Math.round(v*100)+'%'}$('vol').oninput=volume;volume();
function initAudio(){if(ctx)return;ctx=new (window.AudioContext||window.webkitAudioContext)();const src=ctx.createMediaElementSource(audio),shelf=ctx.createBiquadFilter();shelf.type='lowshelf';shelf.frequency.value=200;filter=ctx.createBiquadFilter();filter.type='lowpass';src.connect(shelf);shelf.connect(filter);filter.connect(ctx.destination);const length=Math.round(ctx.sampleRate*4),buf=ctx.createBuffer(1,length,ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*.015;for(let n=0;n<40;n++){const p=Math.floor(Math.random()*length),a=.4+Math.random()*.6;for(let k=0;k<30;k++)data[(p+k)%length]+=(Math.random()*2-1)*a*Math.exp(-k/5)}const noise=ctx.createBufferSource(),hp=ctx.createBiquadFilter();noise.buffer=buf;noise.loop=true;hp.type='highpass';hp.frequency.value=500;crackleGain=ctx.createGain();crackleGain.gain.value=0;noise.connect(hp);hp.connect(crackleGain);crackleGain.connect(ctx.destination);noise.start();updateWarm();updateCrackle()}
function updateWarm(){if(!ctx)return;filter.frequency.value=warmOn?7500:20000;filter.Q.value=.0001;filter.detune.value=0}
function updateCrackle(){if(ctx)crackleGain.gain.setTargetAtTime(crackleOn&&!audio.paused?+$('crackle-level').value:0,ctx.currentTime,.3)}
$('crackle').onclick=()=>{crackleOn=!crackleOn;$('crackle').textContent=crackleOn?'ON':'OFF';$('crackle').classList.toggle('on',crackleOn);$('crackle').setAttribute('aria-pressed',String(crackleOn));updateCrackle()};$('warm').onclick=()=>{warmOn=!warmOn;$('warm').textContent=warmOn?'ON':'OFF';$('warm').classList.toggle('on',warmOn);$('warm').setAttribute('aria-pressed',String(warmOn));updateWarm()};$('crackle-level').oninput=updateCrackle;search();
</script></body></html>
