<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive Turntable</title><style>
:root{--bg:#d3d3d3;--card:#e4e4e4;--ink:#1d1e20;--mute:#8d8d8d;--red:#e0202a;--mono:"SF Mono",ui-monospace,"Courier New",monospace}
*{box-sizing:border-box}
body{margin:0;background:#c9c9c9;font-family:var(--mono);color:var(--ink);letter-spacing:.06em}
.app{max-width:1100px;margin:0 auto;padding:16px}
.shell{background:var(--bg);border-radius:36px;padding:16px;display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:12px;align-items:start}
@media(max-width:860px){.shell{grid-template-columns:1fr;border-radius:28px}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--card);border-radius:28px;padding:20px}
.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.14em}
.lbl b{display:block;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top{display:flex;gap:18px;align-items:center;border-radius:60px;padding:22px 26px}
.dotr{flex:none;width:64px;height:64px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;transition:.3s}
.dotr svg{width:30px;fill:none;stroke:#fff;stroke-width:2}
.top h1{margin:0;font-size:.95rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em}
.top p{margin:4px 0 0;font-size:.82rem;line-height:1.4}
.idle .dotr{background:#b9b9b9}
.platter{position:relative;width:100%;max-width:300px;aspect-ratio:1;margin:18px auto 4px}
.ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--ink)}
.disc{position:absolute;inset:7%;border-radius:50%;background:repeating-radial-gradient(circle,#232427 0 2px,#2c2d30 3px 4px);animation:spin 1.8s linear infinite;animation-play-state:paused}
.disc:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#fff0 0 12%,#ffffff1c 16%,#fff0 22% 62%,#ffffff14 66%,#fff0 72%)}
.playing .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.label{position:absolute;inset:34%;border-radius:50%;background:#bbb center/cover;border:1.5px solid #000}
.label:after{content:"";position:absolute;left:50%;top:50%;width:9%;aspect-ratio:1;transform:translate(-50%,-50%);background:var(--card);border-radius:50%}
.arm{position:absolute;right:0;top:0;width:1px;height:1px;transform-origin:0 0;transform:rotate(14deg);transition:transform 1.2s ease}
.arm i{position:absolute;left:-1px;top:0;width:2px;height:200px;background:var(--ink)}
.arm u{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--ink)}
.arm s{position:absolute;left:-5px;top:196px;width:10px;height:16px;background:var(--ink);border-radius:2px}
.playing .arm{transform:rotate(30deg)}
.now{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-top:14px}
.now>div:first-child{min-width:0}
.now b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now small{color:var(--mute);font-size:.78rem}
.big{font-size:2rem}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:22px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);margin-top:-6px;border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:0}
.time{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mute)}
.ctrl{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
button{font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;background:#f2f2f2;color:var(--ink);border:0;border-radius:40px;padding:12px 20px;cursor:pointer;transition:.15s}
button:hover{background:#fff}button:active{transform:scale(.96)}
#play{background:var(--ink);color:#fff;min-width:120px}
.tracks{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-top:14px}
.tracks::-webkit-scrollbar{display:none}
.tracks:empty:before{content:"No record loaded";font-size:.8rem;color:var(--mute);text-transform:uppercase}
.tracks div{flex:none;width:92px;text-align:center;font-size:.7rem;color:var(--mute);cursor:pointer;padding:4px 2px}
.tracks div:before{content:attr(data-n);display:block;font-size:1.4rem;color:var(--ink);margin-bottom:6px}
.tracks div span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tracks .cur{color:var(--ink);font-weight:700}
.tracks .cur:before{text-decoration:underline}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:250px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.tile svg{width:100%;max-width:200px;margin:14px auto}
.val{font-size:1.9rem}.val small{font-size:.7rem;margin-left:4px;font-weight:700}
.circ{width:120px;height:120px;margin:14px auto;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
.circ div{width:96px;height:96px;border-radius:50%;background:var(--ink);transition:transform .2s}
.tg{display:flex;flex-direction:column;gap:10px}
button.on{background:var(--ink);color:#fff}
.bar{display:flex;gap:10px}
.bar input{flex:1;min-width:0;background:#f2f2f2;border:0;border-radius:40px;padding:13px 20px;font:inherit;font-size:.85rem;color:var(--ink);outline:none;letter-spacing:.08em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chips button{padding:8px 14px;font-size:.7rem;background:transparent;border:1.5px solid #b5b5b5}
.chips button:hover{background:#f2f2f2}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;margin-top:18px}
.rec{cursor:pointer}
.sleeve{aspect-ratio:1;border-radius:20px;background:#bbb center/cover;border:1.5px solid var(--ink);transition:.15s}
.rec:hover .sleeve{transform:scale(.96)}
.rec h3{margin:8px 4px 0;font-size:.72rem;font-weight:700;line-height:1.3;max-height:2.6em;overflow:hidden;text-transform:uppercase}
.rec p{margin:2px 4px 0;font-size:.66rem;color:var(--mute)}
.msg{grid-column:1/-1;text-align:center;padding:26px;color:var(--mute);font-size:.8rem;text-transform:uppercase}
footer{font-size:.68rem;color:var(--mute);text-align:center;padding:10px}
a{color:var(--ink)}
</style></head><body>
<div class="app"><div class="shell">
<div class="col" id="deck">
 <div class="card top" id="alert"><div class="dotr"><svg viewBox="0 0 24 24"><path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18v.5"/></svg></div>
  <div><h1 id="st">Standby</h1><p>Archive Turntable<br>Source: Internet Archive</p></div></div>
 <div class="card">
  <div class="lbl">Now playing<b id="sub">Pick a record</b></div>
  <div class="platter"><div class="ring"></div><div class="disc"></div><div class="label" id="label"></div>
   <div class="arm"><i></i><u></u><s></s></div></div>
  <div class="now"><div><b id="ttl">Drop the needle</b><small>33&#8531; RPM</small></div><div class="big" id="big">0:00</div></div>
  <input type="range" id="seek" min="0" max="1000" value="0" style="margin-top:12px">
  <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctrl"><button id="prev">&#9664;&#9664;</button><button id="play">&#9654; Play</button><button id="next">&#9654;&#9654;</button></div>
 </div>
 <div class="card"><div class="lbl">Tracklist</div><div class="tracks" id="tracks"></div></div>
 <div class="tiles">
  <div class="card tile"><div class="lbl">Progress<b>Side</b></div>
   <svg viewBox="0 0 200 110"><g id="ticks" stroke="#1d1e20" stroke-width="1" opacity=".6"></g>
    <path d="M12 100A88 88 0 0 1 188 100" fill="none" stroke="#1d1e20" stroke-width="1.5"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="#1d1e20" stroke-width="1.5"/>
    <line id="needle" x1="100" y1="100" x2="100" y2="28" stroke="#1d1e20" stroke-width="2" transform="rotate(-90 100 100)"/></svg>
   <div class="val" id="cur2">0%</div></div>
  <div class="card tile"><div class="lbl">Volume</div>
   <div class="circ"><div id="voldot"></div></div>
   <div><div class="val" id="volpct"></div><input type="range" id="vol" min="0" max="1" step=".01" value=".8"></div></div>
  <div class="card tile"><div class="lbl">Crackle<b>Surface noise</b></div>
   <div class="tg"><button id="crk" class="on">ON</button><input type="range" id="crkvol" min="0" max=".3" step=".005" value=".08"></div>
   <div class="lbl">Level</div></div>
  <div class="card tile"><div class="lbl">Warm tone<b>Analog EQ</b></div>
   <div class="tg"><button id="warm" class="on">ON</button></div>
   <div class="lbl">Low-pass</div></div>
 </div>
 <audio id="aud" crossorigin="anonymous" preload="none"></audio>
</div>
<div class="col">
 <div class="card">
  <div class="lbl">Genre radio<b id="gname">All genres</b></div>
  <div class="chips" id="gchips"></div>
  <div class="ctrl" style="justify-content:flex-start"><button id="shuf" style="background:var(--ink);color:#fff">&#8646; Shuffle genre</button><button id="auto" class="on">Auto-play: ON</button></div>
 </div>
 <div class="card">
  <div class="lbl">The crate</div>
  <form class="bar" id="f" style="margin-top:12px"><input type="search" id="q" placeholder="SEARCH ARTIST OR ALBUM WITHIN GENRE"><button style="background:var(--ink);color:#fff">Go</button></form>
  <div class="grid" id="grid"></div>
  <div class="ctrl"><button id="more" style="display:none">Load more</button></div>
 </div>
 <footer>Audio streams from <a href="https://archive.org" target="_blank">archive.org</a>. Check each item page for rights.</footer>
</div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const aud=$('aud'),deck=$('deck');
let page=1,query='',tracks=[],idx=0,item=null,genre='All',autoPlay=true;
const GENRES={
 'All':'',
 'Jazz':'(jazz OR bebop OR "big band" OR swing)',
 'Classic Rock':'("classic rock" OR "hard rock" OR "rock and roll" OR psychedelic)',
 'Indie':'(indie OR "alternative rock" OR "lo-fi" OR "college radio" OR "post-punk")',
 'Country Western':'(country OR western OR bluegrass OR "honky tonk" OR cowboy)',
 'Blues':'(blues OR delta)',
 'Soul / R&B':'(soul OR motown OR "r&b" OR funk)',
 'Folk':'(folk OR "singer-songwriter")',
 'Classical':'(classical OR symphony OR orchestra OR opera)',
 'Soundtrack':'(soundtrack OR "original cast" OR musical)',
 'Easy Listening':'(lounge OR "easy listening" OR exotica OR "space age pop")',
 'Holiday':'(christmas OR holiday)'
};
const BASE='mediatype:audio AND (vinyl OR LP OR "33 rpm" OR "record rip") AND NOT collection:podcasts';
const FL='&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=year&sort[]='+encodeURIComponent('downloads desc')+'&output=json';
$('gchips').innerHTML=Object.keys(GENRES).map(g=>'<button data-g="'+g+'"'+(g==='All'?' class="on"':'')+'>'+g+'</button>').join('');
function setGenre(g,shuffle){
 genre=g;$('gname').textContent=g==='All'?'All genres':g;
 [...$('gchips').children].forEach(b=>b.classList.toggle('on',b.dataset.g===g));
 $('q').value='';go(true);if(shuffle)randomRecord();
}
$('gchips').onclick=e=>{if(e.target.dataset.g)setGenre(e.target.dataset.g,true)};
$('shuf').onclick=()=>randomRecord();
$('auto').onclick=e=>{autoPlay=!autoPlay;e.target.classList.toggle('on',autoPlay);e.target.textContent='Auto-play: '+(autoPlay?'ON':'OFF')};
$('f').onsubmit=e=>{e.preventDefault();go(true)};
$('more').onclick=()=>{page++;go(false)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const one=v=>Array.isArray(v)?v[0]:v;
function buildQ(text){
 const parts=[];if(text)parts.push('('+text+')');if(GENRES[genre])parts.push(GENRES[genre]);parts.push(BASE);
 return parts.join(' AND ');
}
async function go(reset){
 const grid=$('grid');
 if(reset){page=1;grid.innerHTML='';}
 query=$('q').value.trim();
 const u='https://archive.org/advancedsearch.php?q='+encodeURIComponent(buildQ(query))+FL+'&rows=24&page='+page;
 const m=document.createElement('div');m.className='msg';m.textContent='Loading crate...';grid.appendChild(m);
 try{
  const j=await (await fetch(u)).json();m.remove();
  const docs=j.response.docs;
  if(!docs.length&&reset)grid.innerHTML='<div class="msg">No records found</div>';
  docs.forEach(d=>{
   const el=document.createElement('div');el.className='rec';
   el.innerHTML='<div class="sleeve" style="background-image:url(https://archive.org/services/img/'+encodeURIComponent(d.identifier)+')"></div><h3>'+esc(one(d.title))+'</h3><p>'+esc(one(d.creator)||'Unknown artist')+(d.year?' / '+esc(d.year):'')+'</p>';
   el.onclick=()=>load(d);grid.appendChild(el);
  });
  $('more').style.display=docs.length?'inline-block':'none';
 }catch(err){m.textContent='Could not reach the Archive: '+err.message}
}
async function randomRecord(tries){
 tries=tries||0;
 $('ttl').textContent='Finding a record...';$('sub').textContent=genre==='All'?'All genres':genre;
 try{
  const pg=tries>1?1:1+Math.floor(Math.random()*6);
  const u='https://archive.org/advancedsearch.php?q='+encodeURIComponent(buildQ(''))+FL+'&rows=20&page='+pg;
  const docs=(await (await fetch(u)).json()).response.docs;
  if(!docs.length){if(tries<3)return randomRecord(tries+1);$('ttl').textContent='No records found';return}
  const ok=await load(docs[Math.floor(Math.random()*docs.length)]);
  if(ok===false&&tries<4)return randomRecord(tries+1);
 }catch(e){$('ttl').textContent='Could not reach the Archive';$('sub').textContent=e.message}
}
async function load(d){
 $('ttl').textContent='Loading...';$('sub').textContent=one(d.title);
 try{
  const j=await (await fetch('https://archive.org/metadata/'+encodeURIComponent(d.identifier))).json();
  let files=(j.files||[]).filter(f=>/mp3/i.test(f.format||''));
  const vbr=files.filter(f=>/vbr/i.test(f.format));if(vbr.length)files=vbr;
  let seen={};tracks=files.filter(f=>!seen[f.name]&&(seen[f.name]=1)).sort((a,b)=>(a.name>b.name?1:-1));
  if(!tracks.length){$('ttl').textContent='No playable tracks';$('sub').textContent='No MP3 derivative';return false}
  item={id:d.identifier,title:one(d.title),artist:one(d.creator)||'Unknown artist'};
  $('label').style.backgroundImage='url(https://archive.org/services/img/'+encodeURIComponent(d.identifier)+')';
  renderTracks();play(0);return true;
 }catch(e){$('ttl').textContent='Error loading record';$('sub').textContent=e.message;return false}
}
function renderTracks(){
 $('tracks').innerHTML=tracks.map((t,i)=>'<div data-i="'+i+'" data-n="'+String(i+1).padStart(2,'0')+'"><span>'+esc(t.title||t.name)+'</span></div>').join('');
}
$('tracks').onclick=e=>{const d=e.target.closest('[data-i]');if(d)play(+d.dataset.i)};
function play(i){
 idx=(i+tracks.length)%tracks.length;const t=tracks[idx];
 aud.src='https://archive.org/download/'+encodeURIComponent(item.id)+'/'+t.name.split('/').map(encodeURIComponent).join('/');
 $('ttl').textContent=t.title||t.name;$('sub').textContent=item.artist+' - '+item.title;
 [...$('tracks').children].forEach((c,k)=>c.classList.toggle('cur',k===idx));
 initAudio();actx.resume();aud.play().catch(()=>{});
}
$('play').onclick=()=>{if(!tracks.length){randomRecord();return}initAudio();actx.resume();aud.paused?aud.play():aud.pause()};
$('next').onclick=()=>tracks.length&&play(idx+1);
$('prev').onclick=()=>tracks.length&&play(idx-1);
aud.onplay=()=>{deck.classList.add('playing');$('alert').classList.remove('idle');$('st').textContent='Playing';$('play').innerHTML='&#10074;&#10074; Pause';crackle()};
aud.onpause=()=>{deck.classList.remove('playing');$('alert').classList.add('idle');$('st').textContent='Paused';$('play').innerHTML='&#9654; Play';crackle()};
aud.onended=()=>{if(idx<tracks.length-1)play(idx+1);else if(autoPlay)randomRecord();else crackle()};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
aud.ontimeupdate=()=>{
 const p=aud.duration?aud.currentTime/aud.duration:0;
 $('cur').textContent=fmt(aud.currentTime);$('dur').textContent=fmt(aud.duration);$('big').textContent=fmt(aud.currentTime);
 $('seek').value=p*1000;$('needle').setAttribute('transform','rotate('+(-90+p*180)+' 100 100)');
 $('cur2').textContent=Math.round(p*100)+'%';
};
$('seek').oninput=e=>{if(aud.duration)aud.currentTime=e.target.value/1000*aud.duration};
$('alert').classList.add('idle');
function volDot(){const v=+$('vol').value;aud.volume=v;$('voldot').style.transform='scale('+(0.1+v*0.9)+')';$('volpct').innerHTML=Math.round(v*100)+'<small>%</small>'}
$('vol').oninput=volDot;volDot();
(function(){let t='';for(let i=0;i<=18;i++){const a=(-90+i*10)*Math.PI/180,r1=i%3?80:74;
 t+='<line x1="'+(100+Math.sin(a)*r1)+'" y1="'+(100-Math.cos(a)*r1)+'" x2="'+(100+Math.sin(a)*88)+'" y2="'+(100-Math.cos(a)*88)+'"/>'}
 $('ticks').innerHTML=t})();
let actx,warmF,crkGain,crkOn=true,warmOn=true;
function initAudio(){
 if(actx)return;
 actx=new (window.AudioContext||window.webkitAudioContext)();
 crkGain=actx.createGain();crkGain.gain.value=0;
 const len=actx.sampleRate*4,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<len;i++){d[i]=(Math.random()*2-1)*0.015}
 for(let n=0;n<40;n++){const p=Math.floor(Math.random()*len),a=0.4+Math.random()*0.6;
  for(let k=0;k<30;k++)d[(p+k)%len]+=(Math.random()*2-1)*a*Math.exp(-k/5)}
 const cs=actx.createBufferSource();cs.buffer=buf;cs.loop=true;
 const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=500;
 cs.connect(hp);hp.connect(crkGain);crkGain.connect(actx.destination);cs.start();
 try{
  const src=actx.createMediaElementSource(aud);
  warmF=actx.createBiquadFilter();warmF.type='lowpass';warmF.frequency.value=7500;
  const shelf=actx.createBiquadFilter();shelf.type='lowshelf';shelf.frequency.value=200;shelf.gain.value=3;
  src.connect(shelf);shelf.connect(warmF);warmF.connect(actx.destination);
 }catch(e){}
 applyFx();
}
function crackle(){if(!actx)return;crkGain.gain.setTargetAtTime(crkOn&&!aud.paused?+$('crkvol').value:0,actx.currentTime,.3)}
function applyFx(){if(warmF)warmF.frequency.value=warmOn?7500:20000;crackle()}
$('crk').onclick=e=>{crkOn=!crkOn;e.target.classList.toggle('on',crkOn);e.target.textContent=crkOn?'ON':'OFF';applyFx()};
$('warm').onclick=e=>{warmOn=!warmOn;e.target.classList.toggle('on',warmOn);e.target.textContent=warmOn?'ON':'OFF';applyFx()};
$('crkvol').oninput=crackle;
go(true);
</script></body></html>
